<!DOCTYPE html>
<html>
<head>
    <title>View Books</title>
</head>
<body>

<h2>Book List</h2>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Book Title</th>
        <th>Author</th>
    </tr>

    {% for book in books %}

    <tr>
        <td>{{ book[0] }}</td>
        <td>{{ book[1] }}</td>
        <td>{{ book[2] }}</td>
    </tr>

    {% endfor %}

</table>

</body>
</html>
