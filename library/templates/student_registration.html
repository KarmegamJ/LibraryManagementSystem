{% extends "basic.html" %} {% load static %} {% block title %}Student
Registration{% endblock %} {% block body %}

<section class="min-h-screen bg-blue-50 py-14 px-6">
  <div class="max-w-5xl mx-auto">
    <!-- Main Card -->

    <div
      class="bg-white rounded-[2rem] shadow-xl border border-blue-100 overflow-hidden"
    >
      <!-- Header -->

      <div
        class="bg-gradient-to-r from-blue-700 to-blue-400 px-8 md:px-12 py-10"
      >
        <div class="flex items-center gap-4">
          <div
            class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-3xl"
          >
            🎓
          </div>

          <div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white">
              Student Registration
            </h1>

            <p class="text-blue-100 mt-2">
              Create your student account to access the Library Management
              System.
            </p>
          </div>
        </div>
      </div>

      <!-- Form -->

      <form
        method="POST"
        enctype="multipart/form-data"
        class="p-8 md:p-12 space-y-7"
      >
        {% csrf_token %}

        <!-- Username -->

        <div>
          <label class="block text-blue-800 font-semibold mb-2">
            Username
          </label>

          <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
            class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 text-gray-700 placeholder-gray-400 outline-none focus:ring-2 focus:ring-blue-400 transition duration-300"
          />
        </div>

        <!-- Name -->

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              First Name
            </label>

            <input
              type="text"
              name="first_name"
              placeholder="First Name"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>

          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Last Name
            </label>

            <input
              type="text"
              name="last_name"
              placeholder="Last Name"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
        </div>

        <!-- Email Phone -->

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Email
            </label>

            <input
              type="email"
              name="email"
              placeholder="Email Address"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>

          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Mobile Number
            </label>

            <input
              type="number"
              name="phone"
              placeholder="Mobile Number"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
        </div>

        <!-- Branch Classroom -->

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Branch
            </label>

            <input
              type="text"
              name="branch"
              placeholder="Branch Name"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>

          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Classroom
            </label>

            <input
              type="text"
              name="classroom"
              placeholder="Class Name"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
        </div>

        <!-- Roll Number Image -->

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Roll Number
            </label>

            <input
              type="text"
              name="roll_no"
              placeholder="Roll Number"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>

          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Student Image
            </label>

            <input
              type="file"
              name="image"
              required
              class="w-full px-4 py-3 rounded-2xl bg-blue-50 border border-blue-200 file:bg-blue-600 file:text-white file:border-0 file:px-4 file:py-2 file:rounded-xl"
            />
          </div>
        </div>

        <!-- Password -->

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Password
            </label>

            <input
              type="password"
              name="password"
              placeholder="Password"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>

          <div>
            <label class="block text-blue-800 font-semibold mb-2">
              Confirm Password
            </label>

            <input
              type="password"
              name="confirm_password"
              placeholder="Confirm Password"
              required
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
        </div>

        <!-- Button -->

        <button
          type="submit"
          class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-700 to-blue-400 text-white font-bold text-lg shadow-lg hover:scale-[1.02] hover:shadow-blue-300 transition duration-300"
        >
          Register as Student
        </button>
      </form>
    </div>
  </div>
</section>

{% endblock %} {% block js %}

<script>

  {% if alert %}

  alert("Registration Successful!");

  window.location.href="/student_login/";

  {% endif %}
</script>

{% endblock %}
