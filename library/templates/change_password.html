{% extends 'student_navbar.html' %} {% load static %} {% block title %} Change
Password {% endblock %} {% block css %} {% endblock %} {% block body %}

<section class="min-h-screen bg-blue-50 py-12 px-5">
  <div class="max-w-4xl mx-auto">
    <!-- Card -->

    <div
      class="bg-white rounded-[2rem] shadow-xl border border-blue-100 p-8 md:p-10"
    >
      <!-- Header -->

      <div class="text-center mb-10">
        <div
          class="w-20 h-20 mx-auto flex items-center justify-center rounded-full bg-blue-100 text-blue-600 text-4xl mb-5"
        >
          🔐
        </div>

        <h1 class="text-3xl md:text-4xl font-bold text-blue-700">
          Change Password
        </h1>

        <p class="text-gray-500 mt-3">Update your account password securely</p>
      </div>

      <form
        method="POST"
        name="change_password"
        onsubmit="return checkPassword();"
      >
        {% csrf_token %}

        <!-- Username & Current Password -->

        <div class="grid md:grid-cols-2 gap-6">
          <!-- Username -->

          <div>
            <label class="block text-blue-700 font-semibold mb-2">
              Username
            </label>

            <input
              type="text"
              name="username"
              value="{{request.user}}"
              readonly
              class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-600 outline-none cursor-not-allowed"
            />
          </div>

          <!-- Current Password -->

          <div>
            <label class="block text-blue-700 font-semibold mb-2">
              Current Password
            </label>

            <input
              type="password"
              name="current_password"
              placeholder="Current Password"
              class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition"
            />
          </div>
        </div>

        <!-- New Password -->

        <div class="mt-6">
          <label class="block text-blue-700 font-semibold mb-2">
            New Password
          </label>

          <input
            type="password"
            name="new_password"
            placeholder="Enter the new password"
            class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition"
          />
        </div>

        <!-- Confirm Password -->

        <div class="mt-6">
          <label class="block text-blue-700 font-semibold mb-2">
            Confirm Password
          </label>

          <input
            type="password"
            name="confirm_password"
            placeholder="Confirm the new password"
            class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition"
          />
        </div>

        <!-- Button -->

        <div class="mt-10 text-center">
          <button
            type="submit"
            class="px-10 py-3 rounded-full bg-blue-600 text-white font-semibold shadow-lg hover:bg-blue-700 hover:scale-105 transition duration-300"
          >
            Update Password
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

{% endblock %} {% block js %}

<script>

  function checkPassword() {

      if (
          document.change_password.new_password.value !=
          document.change_password.confirm_password.value
      ) {

          alert("New Password and Confirm Password fields does not match each other.");

          document.change_password.confirm_password.focus();

          return false;

      }

      return true;

  }



  {% if alert %}

  alert("Password Updated Successfully.");

  document.location = "/logout"

  {% endif %}




  {% if currpasswrong %}

  alert("Current Password is wrong..");

  document.location = "/change_password"

  {% endif %}
</script>

{% endblock %}
