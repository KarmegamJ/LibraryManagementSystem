{% extends 'student_navbar.html' %} 


{% block title %} Edit Profile {% endblock %} 





 {% block body %}





<section class="min-h-screen bg-blue-50 py-12 px-5">
  <div class="max-w-4xl mx-auto">
    <!-- Card -->

    <div
      class="bg-white rounded-[2rem] shadow-xl border border-blue-100 p-8 md:p-10"
    >
      <!-- Header -->

      <div class="text-center mb-10">
        <div
          class="w-20 h-20 mx-auto flex items-center justify-center rounded-full bg-blue-100 text-blue-600 text-4xl mb-5"
        >
          ✏️
        </div>

        <h1 class="text-3xl md:text-4xl font-bold text-blue-700">
          Edit Profile
        </h1>

        <p class="text-gray-500 mt-3">Update your personal information</p>
      </div>

      <form method="POST">
        {% csrf_token %}

        <!-- Row 1 -->

        <div class="grid md:grid-cols-2 gap-6">
          <!-- Email -->

          <div>
            <label class="block text-blue-700 font-semibold mb-2">
              Email
            </label>

            <input
              type="email"
              name="email"
              value="{{user.email}}"
              class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
            />
          </div>

          <!-- Phone -->

          <div>
            <label class="block text-blue-700 font-semibold mb-2">
              Mobile Number
            </label>

            <input
              type="number"
              name="phone"
              value="{{user.student.phone}}"
              class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
            />
          </div>
        </div>

        <!-- Row 2 -->

        <div class="grid md:grid-cols-2 gap-6 mt-6">
          <!-- Branch -->

          <div>
            <label class="block text-blue-700 font-semibold mb-2">
              Branch Name
            </label>

            <input
              type="text"
              name="branch"
              value="{{user.student.branch}}"
              class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition"
            />
          </div>

          <!-- Class -->

          <div>
            <label class="block text-blue-700 font-semibold mb-2">
              Class Name
            </label>

            <input
              type="text"
              name="classroom"
              value="{{user.student.classroom}}"
              class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition"
            />
          </div>
        </div>

        <!-- Row 3 -->

        <div class="mt-6 md:w-1/2">
          <label class="block text-blue-700 font-semibold mb-2">
            Roll Number
          </label>

          <input
            type="text"
            name="roll_no"
            value="{{user.student.roll_no}}"
            class="w-full px-5 py-3 rounded-2xl border border-blue-200 bg-blue-50 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition"
          />
        </div>

        <!-- Button -->

        <div class="mt-10 text-center">
          <button
            type="submit"
            class="px-10 py-3 rounded-full bg-blue-600 text-white font-semibold shadow-lg hover:bg-blue-700 hover:scale-105 transition duration-300"
          >
            Update Profile
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

{% endblock %} {% block js %}

<script>

  {% if alert %}

  alert("Profile Updated Successfully.")

  document.location = "/profile"

  {% endif %}
</script>

{% endblock %}
