{% extends 'basic.html' %} {% load static %} {% block title %} Library
Management System {% endblock %} {% block css %} {% endblock %} {% block body %}

<section
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-blue-100 px-5 py-16"
>
  <div class="w-full max-w-md">
    <!-- Login Card -->

    <div
      class="bg-white rounded-[2rem] shadow-xl border border-blue-100 overflow-hidden"
    >
      <!-- Header -->

      <div class="bg-gradient-to-r from-blue-600 to-sky-400 p-8 text-center">
        <div
          class="w-20 h-20 mx-auto rounded-full bg-white/20 flex items-center justify-center text-4xl mb-5"
        >
          🔐
        </div>

        <h1 class="text-3xl font-bold text-white">Student Login</h1>

        <p class="mt-2 text-blue-100">Library Management System</p>
      </div>

      <!-- Form -->

      <div class="p-8">
        <form method="POST">
          {% csrf_token %}

          <!-- Username -->

          <div class="mb-6">
            <label class="block text-slate-700 font-semibold mb-2">
              <i> Username </i>
            </label>

            <input
              type="text"
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 text-slate-800 placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
              name="username"
              placeholder="Enter Username"
              required
            />
          </div>

          <!-- Password -->

          <div class="mb-6">
            <label class="block text-slate-700 font-semibold mb-2">
              <i> Password </i>
            </label>

            <input
              type="password"
              class="w-full px-5 py-3 rounded-2xl bg-blue-50 border border-blue-200 text-slate-800 placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
              name="password"
              placeholder="Enter Password"
              required
            />
          </div>

          <!-- Button -->

          <button
            type="submit"
            class="w-full py-3 rounded-2xl bg-blue-600 text-white font-semibold text-lg shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-1 transition duration-300"
          >
            Login
          </button>
        </form>
      </div>
    </div>
  </div>
</section>

{% endblock %} {% block js %}

<script>

  {% if alert %}

  alert("Invalid Username or Password.")

  document.location = "/student_login"

  {% endif %}
</script>

{% endblock %}
